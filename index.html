    <style>
        /* Menghilangkan margin dan membuat layar pas 100% */

            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a; /* Background diubah gelap agar menyatu */
        }

        /* Memaksa Iframe mengisi seluruh layar */
        iframe {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch; /* Kelancaran scroll di iOS/iPhone */
            overflow-y: auto;
        }
    </style>
</head>
